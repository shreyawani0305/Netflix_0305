<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1414" viewBox="0 0 1000 1414" role="img" aria-labelledby="poster-title poster-description">
  <title id="poster-title">Streaming, Reimagined — Project One-Pager</title>
  <desc id="poster-description">A poster presenting an interactive Netflix-inspired streaming interface built with React, Vite, and TMDB.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111114"/>
      <stop offset=".58" stop-color="#09090b"/>
      <stop offset="1" stop-color="#171014"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#431b28"/>
      <stop offset=".54" stop-color="#8e2731"/>
      <stop offset="1" stop-color="#ed542f"/>
    </linearGradient>
    <linearGradient id="red-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff514d"/>
      <stop offset="1" stop-color="#bd0715"/>
    </linearGradient>
    <linearGradient id="thumb-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24494e"/>
      <stop offset="1" stop-color="#101c29"/>
    </linearGradient>
    <linearGradient id="thumb-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5927"/>
      <stop offset="1" stop-color="#361b2c"/>
    </linearGradient>
    <linearGradient id="thumb-c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58508a"/>
      <stop offset="1" stop-color="#211c3e"/>
    </linearGradient>
    <linearGradient id="thumb-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c3634"/>
      <stop offset="1" stop-color="#241920"/>
    </linearGradient>
    <linearGradient id="thumb-e" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#40613e"/>
      <stop offset="1" stop-color="#1b2926"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="12"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="screen-clip">
      <rect x="74" y="350" width="852" height="380" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1000" height="1414" fill="url(#background)"/>
  <rect width="1000" height="1414" fill="url(#grid)" opacity=".55"/>
  <circle cx="948" cy="275" r="220" fill="#d20a19" opacity=".11"/>
  <circle cx="72" cy="1087" r="170" fill="#a1131c" opacity=".075"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="74" y="62" width="34" height="4" rx="2" fill="#e50914"/>
    <text x="120" y="70" fill="#f3f0ef" font-size="15" font-weight="700" letter-spacing="2.4">PROJECT SHOWCASE</text>
    <text x="926" y="70" text-anchor="end" fill="#a6a0a0" font-size="12" font-weight="700" letter-spacing="1.6">FRONT-END WEB EXPERIENCE  /  2026</text>

    <text x="74" y="183" fill="#f7f5f4" font-size="83" font-weight="800" letter-spacing="-4">STREAMING,</text>
    <text x="74" y="268" fill="#f7f5f4" font-size="83" font-weight="800" letter-spacing="-4">REIMAGINED<tspan fill="#ed2029">.</tspan></text>
    <text x="78" y="311" fill="#bcb5b5" font-size="15" font-weight="600" letter-spacing="2.2">A NETFLIX-INSPIRED INTERACTIVE STREAMING PLATFORM</text>
    <text x="78" y="336" fill="#817b7b" font-size="13" letter-spacing=".35">A responsive, feature-rich web UI for discovering what to watch next.</text>

    <g filter="url(#soft-shadow)">
      <rect x="74" y="350" width="852" height="380" rx="22" fill="#121215" stroke="#383337" stroke-width="1.5"/>
    </g>
    <g clip-path="url(#screen-clip)">
      <rect x="74" y="350" width="852" height="380" fill="#121215"/>
      <rect x="74" y="350" width="852" height="48" fill="#0b0b0d"/>
      <path d="M95 363h7l13 27h-7z" fill="#e50914"/>
      <path d="M95 363h7v27h-7z" fill="#b20710"/>
      <text x="124" y="382" fill="#f7f5f4" font-size="12" font-weight="800" letter-spacing="1.8">NETFLIX</text>
      <text x="222" y="382" fill="#e5e1e1" font-size="10">Home</text>
      <text x="276" y="382" fill="#9b9697" font-size="10">Series</text>
      <text x="325" y="382" fill="#9b9697" font-size="10">Films</text>
      <text x="370" y="382" fill="#9b9697" font-size="10">Games</text>
      <circle cx="887" cy="374" r="10" fill="#292529"/>
      <circle cx="887" cy="370" r="3" fill="#d0caca"/>
      <path d="M881 381c1-5 11-5 12 0" fill="#d0caca"/>

      <rect x="74" y="398" width="852" height="212" fill="url(#hero)"/>
      <circle cx="804" cy="446" r="112" fill="#ffb05f" opacity=".18"/>
      <circle cx="804" cy="446" r="72" fill="#ffd49a" opacity=".12"/>
      <path d="M612 610c65-80 120-91 169-53 44-81 101-64 145-4v57H612z" fill="#21151c" opacity=".72"/>
      <path d="M693 610c55-47 101-44 134-13 34-51 64-43 99-2v15H693z" fill="#120f13" opacity=".62"/>
      <text x="105" y="445" fill="#fff" font-size="10" font-weight="700" letter-spacing="3">FEATURED FILM</text>
      <text x="102" y="496" fill="#fff" font-size="43" font-weight="800" letter-spacing="-1.7">MAHARAJA</text>
      <text x="105" y="520" fill="#e6d9d4" font-size="11">A gripping story. One unforgettable journey.</text>
      <rect x="105" y="542" width="91" height="31" rx="4" fill="#f6f3f1"/>
      <path d="M118 552v11l9-5.5z" fill="#171416"/>
      <text x="136" y="562" fill="#171416" font-size="11" font-weight="700">Play</text>
      <rect x="204" y="542" width="111" height="31" rx="4" fill="#777174" opacity=".8"/>
      <circle cx="220" cy="557.5" r="6" fill="none" stroke="#fff" stroke-width="1.5"/>
      <text x="233" y="562" fill="#fff" font-size="11" font-weight="700">More Info</text>

      <text x="98" y="634" fill="#f3f0ef" font-size="13" font-weight="700">Made for your next movie night</text>
      <g>
        <rect x="98" y="646" width="144" height="66" rx="7" fill="url(#thumb-a)"/>
        <path d="M98 699c28-31 50-30 71-9 20-25 46-21 73-3v25H98z" fill="#111a24" opacity=".65"/>
        <text x="110" y="704" fill="#f5f2f1" font-size="9" font-weight="700">THE DEEP BLUE</text>
        <rect x="253" y="646" width="144" height="66" rx="7" fill="url(#thumb-b)"/>
        <circle cx="355" cy="666" r="18" fill="#f3bd75" opacity=".48"/>
        <text x="265" y="704" fill="#f5f2f1" font-size="9" font-weight="700">GOLDEN HOUR</text>
        <rect x="408" y="646" width="144" height="66" rx="7" fill="url(#thumb-c)"/>
        <path d="M408 704l47-42 29 24 31-31 36 49z" fill="#16162c" opacity=".75"/>
        <text x="420" y="704" fill="#f5f2f1" font-size="9" font-weight="700">AFTER THE FALL</text>
        <rect x="563" y="646" width="144" height="66" rx="7" fill="url(#thumb-d)"/>
        <circle cx="642" cy="669" r="25" fill="#e78b70" opacity=".2"/>
        <text x="575" y="704" fill="#f5f2f1" font-size="9" font-weight="700">NIGHT SHIFT</text>
        <rect x="718" y="646" width="144" height="66" rx="7" fill="url(#thumb-e)"/>
        <path d="M718 710l44-37 33 21 24-23 43 39z" fill="#15241d" opacity=".8"/>
        <text x="730" y="704" fill="#f5f2f1" font-size="9" font-weight="700">WILD HORIZON</text>
      </g>
    </g>
    <rect x="74" y="350" width="852" height="380" rx="22" fill="none" stroke="#4a4145" stroke-width="1"/>

    <text x="76" y="790" fill="#ed2029" font-size="12" font-weight="700" letter-spacing="2.3">01  /  THE EXPERIENCE</text>
    <text x="76" y="824" fill="#f5f2f1" font-size="26" font-weight="700" letter-spacing="-.5">DISCOVER. PLAY. MAKE IT YOURS.</text>
    <text x="76" y="849" fill="#a7a0a0" font-size="13">One connected experience, from browsing to your next watch.</text>

    <g>
      <rect x="76" y="878" width="406" height="104" rx="12" fill="#151416" stroke="#302a2d"/>
      <circle cx="104" cy="908" r="14" fill="#351317"/>
      <text x="104" y="912" text-anchor="middle" fill="#ff6669" font-size="10" font-weight="700">01</text>
      <text x="130" y="912" fill="#f4f0ef" font-size="15" font-weight="700">Find your next favorite</text>
      <text x="100" y="941" fill="#aaa3a4" font-size="12">Trending, genres, languages, and hand-picked rows</text>
      <text x="100" y="961" fill="#aaa3a4" font-size="12">bring a rich catalog within easy reach.</text>

      <rect x="518" y="878" width="406" height="104" rx="12" fill="#151416" stroke="#302a2d"/>
      <circle cx="546" cy="908" r="14" fill="#351317"/>
      <text x="546" y="912" text-anchor="middle" fill="#ff6669" font-size="10" font-weight="700">02</text>
      <text x="572" y="912" fill="#f4f0ef" font-size="15" font-weight="700">More than a play button</text>
      <text x="542" y="941" fill="#aaa3a4" font-size="12">Interactive playback, trailer previews, and saved</text>
      <text x="542" y="961" fill="#aaa3a4" font-size="12">watch progress make every visit feel alive.</text>

      <rect x="76" y="996" width="406" height="104" rx="12" fill="#151416" stroke="#302a2d"/>
      <circle cx="104" cy="1026" r="14" fill="#351317"/>
      <text x="104" y="1030" text-anchor="middle" fill="#ff6669" font-size="10" font-weight="700">03</text>
      <text x="130" y="1030" fill="#f4f0ef" font-size="15" font-weight="700">Your space, your list</text>
      <text x="100" y="1059" fill="#aaa3a4" font-size="12">My List, likes, and Continue Watching stay in sync</text>
      <text x="100" y="1079" fill="#aaa3a4" font-size="12">with persistent local data.</text>

      <rect x="518" y="996" width="406" height="104" rx="12" fill="#151416" stroke="#302a2d"/>
      <circle cx="546" cy="1026" r="14" fill="#351317"/>
      <text x="546" y="1030" text-anchor="middle" fill="#ff6669" font-size="10" font-weight="700">04</text>
      <text x="572" y="1030" fill="#f4f0ef" font-size="15" font-weight="700">Browse beyond the usual</text>
      <text x="542" y="1059" fill="#aaa3a4" font-size="12">Mood discovery, Surprise Me, games, and new</text>
      <text x="542" y="1079" fill="#aaa3a4" font-size="12">releases give you fresh ways to explore.</text>
    </g>

    <rect x="76" y="1128" width="848" height="1" fill="#3a3336"/>
    <text x="76" y="1164" fill="#ed2029" font-size="11" font-weight="700" letter-spacing="2">02  /  BUILT WITH</text>
    <g font-size="12" font-weight="600">
      <rect x="76" y="1182" width="133" height="35" rx="17.5" fill="#20191c" stroke="#443338"/>
      <text x="142.5" y="1204" text-anchor="middle" fill="#eee9e8">React</text>
      <rect x="219" y="1182" width="133" height="35" rx="17.5" fill="#20191c" stroke="#443338"/>
      <text x="285.5" y="1204" text-anchor="middle" fill="#eee9e8">Vite</text>
      <rect x="362" y="1182" width="133" height="35" rx="17.5" fill="#20191c" stroke="#443338"/>
      <text x="428.5" y="1204" text-anchor="middle" fill="#eee9e8">React Router</text>
      <rect x="505" y="1182" width="133" height="35" rx="17.5" fill="#20191c" stroke="#443338"/>
      <text x="571.5" y="1204" text-anchor="middle" fill="#eee9e8">Responsive CSS</text>
      <rect x="648" y="1182" width="133" height="35" rx="17.5" fill="#20191c" stroke="#443338"/>
      <text x="714.5" y="1204" text-anchor="middle" fill="#eee9e8">TMDB API</text>
      <rect x="791" y="1182" width="133" height="35" rx="17.5" fill="#20191c" stroke="#443338"/>
      <text x="857.5" y="1204" text-anchor="middle" fill="#eee9e8">Local Storage</text>
    </g>

    <rect x="76" y="1254" width="848" height="1" fill="#3a3336"/>
    <rect x="76" y="1281" width="4" height="52" rx="2" fill="url(#red-glow)"/>
    <text x="96" y="1299" fill="#f2eeee" font-size="13" font-weight="700">A hands-on exploration of modern streaming UI design.</text>
    <text x="96" y="1321" fill="#a49c9e" font-size="11">Independent educational project. Not affiliated with or endorsed by Netflix or TMDB.</text>
    <text x="924" y="1321" text-anchor="end" fill="#777174" font-size="10" font-weight="700" letter-spacing="1.2">DISCOVER YOUR NEXT STORY</text>
  </g>
</svg>
