<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Mood DJ</title>
<style>
:root{--bg:#f4f2fb;--side:#f0edfa;--card:#fff;--ink:#2a2540;--mut:#625e7d;--ac:#6a4bd8;--ln:#d8d3ea;--tr:#dcd7ee}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #f5a623;outline-offset:2px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:150px 1fr;min-height:100vh;max-width:1240px;margin:0 auto}
.side{background:var(--side);padding:20px 14px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--ln)}
.logo{font-size:2.2rem;font-weight:800;color:#4a4a58;margin:0 0 18px 8px;letter-spacing:-.04em}
.side button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:999px;padding:12px 14px;min-height:46px;font-weight:600;font-size:.92rem;text-align:left}
.side button[aria-current="page"]{background:var(--ac);color:#fff}
.side .sp{flex:1;min-height:60px}
.main{padding:20px 28px 40px;min-width:0}
.top{display:flex;gap:16px;align-items:center;margin-bottom:22px;position:relative}
.srch{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--ln);border-radius:999px;padding:0 16px;min-height:48px}
.srch input{flex:1;border:0;outline:0;background:none;min-height:44px}
.srch:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px #6a4bd833}
.ib{background:none;border:0;border-radius:50%;width:46px;height:46px;display:grid;place-items:center}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(140deg,#6a4bd8,#e07aa8);color:#fff;font-weight:700;border:0}
.pop{position:absolute;right:0;top:56px;background:#fff;border:1px solid var(--ln);border-radius:16px;box-shadow:0 12px 30px #2a254022;padding:8px;min-width:240px;z-index:5}
.pop button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;min-height:44px}
.pop button:hover{background:var(--bg)}
.pop p{margin:0;padding:8px 12px;font-size:.9rem}
.card{background:var(--card);border:1.5px solid var(--ln);border-radius:26px;padding:22px 26px 30px;position:relative;display:grid;grid-template-columns:1fr 200px;gap:10px;margin-bottom:30px}
.hd{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.hd h2{margin:0;font-size:1.6rem;letter-spacing:-.01em}
.hd p{margin:2px 0 0;color:var(--mut)}
.row{display:grid;grid-template-columns:34px 130px 1fr 80px;gap:12px;align-items:center;min-height:48px}
.row label{font-weight:500}
.row output{color:var(--mut);font-size:.95rem}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--ac) var(--v,50%),var(--tr) var(--v,50%));outline-offset:8px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--ac);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--ac)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--ac);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--ac)}
.pic{grid-row:1/3;grid-column:2;align-self:center;justify-self:center;position:relative}
.pic svg.corn{width:190px;height:190px;stroke:#4b4668;stroke-width:2}
.play{position:absolute;right:-6px;bottom:6px;width:58px;height:58px;border-radius:50%;background:#fff;border:2.5px solid #2a2540;display:grid;place-items:center;padding:0}
.play svg{fill:#2a2540;stroke:none;width:22px;height:22px}
.gen{grid-column:1/3;justify-self:center;display:flex;gap:8px;align-items:center;background:var(--ac);color:#fff;border:0;border-radius:999px;padding:0 44px;min-height:54px;font-weight:700;font-size:1.05rem;position:absolute;left:50%;bottom:-27px;transform:translateX(-50%);box-shadow:0 8px 20px #6a4bd855;white-space:nowrap}
.gen:hover{filter:brightness(1.08)}
.gen svg{width:18px;height:18px}
.sh{display:flex;justify-content:space-between;align-items:center;margin:44px 0 14px}
.sh h3{margin:0;font-size:1.2rem}
.sh button{background:none;border:0;font-weight:600;display:flex;gap:6px;align-items:center;min-height:44px;color:var(--ink)}
.stat{min-height:1.4em;color:var(--mut);margin:-6px 0 10px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.ph{aspect-ratio:1/1.05;border:1.5px solid var(--ln);border-radius:14px;background:linear-gradient(to top right,transparent calc(50% - 1px),var(--ln),transparent calc(50% + 1px)),linear-gradient(to bottom right,transparent calc(50% - 1px),var(--ln),transparent calc(50% + 1px)),#f8f7fd}
.t{display:flex;flex-direction:column;gap:6px}
.th{aspect-ratio:1/1.05;border-radius:14px;position:relative;overflow:hidden;display:grid;place-items:center;color:#fff;font-size:2.8rem;font-weight:800;text-shadow:0 2px 8px #0005}
.th b{position:absolute;top:8px;right:8px;background:#fff;color:var(--ac);font-size:.78rem;border-radius:999px;padding:2px 9px;text-shadow:none}
.t strong{font-size:.95rem}.t small{color:var(--mut)}
.t button{background:#fff;border:1.5px solid var(--ln);border-radius:999px;min-height:44px;font-weight:600}
.t button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}
.empty{grid-column:1/-1;color:var(--mut);padding:20px;border:1.5px dashed var(--ln);border-radius:14px}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--ln)}.side .sp,.logo{display:none}.side button{white-space:nowrap}.main{padding:16px}.card{grid-template-columns:1fr}.pic{grid-row:auto;grid-column:1;order:-1;justify-self:end;margin-bottom:-120px}.pic svg.corn{width:120px;height:120px}.row{grid-template-columns:28px 90px 1fr 64px;gap:8px}.hd{max-width:calc(100% - 110px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
 <aside class="side" aria-label="Sidebar">
  <div class="logo" aria-hidden="true">N</div>
  <nav id="nav" style="display:contents" aria-label="Main">
   <button data-v="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10H3z"/></svg>Home</button>
   <button data-v="movie"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M3 8l3-5 4 5 3-5 4 5 3-5"/></svg>Movies</button>
   <button data-v="series"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 2l4 4 4-4"/></svg>Series</button>
   <button data-v="list"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>My List</button>
  </nav>
  <div class="sp"></div>
  <button id="sSearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg>Search</button>
  <button id="sProf"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg>Profile</button>
 </aside>
 <div class="main">
  <header class="top">
   <label class="srch"><span class="sr" style="position:absolute;left:-9999px">Search titles</span>
    <input id="q" type="search" placeholder="Search for something…" autocomplete="off">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg></label>
   <button class="ib" id="bell" aria-label="Notifications" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0112 0v6l2 2H4z"/><path d="M10 21h4"/></svg></button>
   <button class="av" id="avt" aria-label="Profile menu" aria-expanded="false">S</button>
   <div class="pop" id="pop" hidden></div>
  </header>

  <section class="card" id="dj" aria-labelledby="djt">
   <div>
    <div class="hd">
     <svg viewBox="0 0 40 24" style="width:44px;height:30px;stroke:var(--ac);stroke-width:2.4" aria-hidden="true"><path d="M2 12h4M10 5v14M16 9v6M22 2v20M28 7v10M34 10v4M38 12h0"/></svg>
     <div><h2 id="djt">The Mood DJ</h2><p>Set the vibe. We’ll take care of the rest. ✦</p></div>
    </div>
    <div id="sl"></div>
   </div>
   <div class="pic">
    <svg class="corn" viewBox="0 0 190 190" aria-hidden="true">
     <g fill="#fff"><circle cx="60" cy="50" r="17"/><circle cx="90" cy="38" r="19"/><circle cx="122" cy="50" r="17"/><circle cx="76" cy="68" r="16"/><circle cx="108" cy="66" r="16"/></g>
     <path d="M38 84h104l-14 92H52z" fill="#fff"/>
     <path d="M62 84l6 92M90 84v92M118 84l-6 92" stroke="#6a4bd8"/>
     <path d="M34 28l-4-8M48 20l-2-8M150 24l6-8M160 40l8-3" stroke="#6a4bd8" stroke-width="2.4"/>
    </svg>
    <button class="play" id="surp" aria-label="Surprise me: random vibe"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
   </div>
   <button class="gen" id="gen"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 6.3L20 12l-5.8 2.7L12 21l-2.2-6.3L4 12l5.8-2.7z"/></svg>Generate for Me</button>
  </section>

  <div class="sh"><h3 id="ttl">Popular Picks for You</h3><button id="all">See all <span aria-hidden="true">→</span></button></div>
  <div class="stat" id="stat" role="status" aria-live="polite"></div>
  <div class="grid" id="grid"></div>
 </div>
</div>
<script>
(function(){
var T=[
["Midnight Harbor","series",2024,35,85,10,40,"#24305f","#5a2a62"],
["Soup Season","series",2023,15,5,60,75,"#c9692f","#7d2e3f"],
["Zero Gravity","movie",2025,90,80,5,30,"#0f6b8f","#1b2a6b"],
["Odd Couple Camp","series",2022,50,5,95,70,"#d4a017","#c24a2d"],
["Paper Planets","movie",2021,45,10,45,60,"#3a8f5b","#2a4f8f"],
["Chase Line","series",2024,95,70,15,35,"#b3261e","#4a1230"],
["Sunday Sauce","movie",2020,20,5,70,90,"#d96c3a","#8f3a22"],
["The Long Quiet","movie",2025,25,90,5,20,"#5a4a8f","#1d2a4f"],
["Mixed Signals","series",2023,60,20,90,55,"#7b4fd1","#d1478f"],
["Bedtime Kingdom","series",2021,30,5,50,85,"#2f8f9d","#3d3a9d"],
["Tea Break","movie",2019,10,5,65,80,"#8a6a3a","#4a3a22"],
["Night Lights","movie",2022,35,30,25,50,"#3a4f8f","#1d1d4a"],
["Iron Tide","movie",2025,92,55,10,45,"#2c3e50","#c0392b"],
["Laugh Track","series",2024,70,5,98,60,"#e67e22","#9b59b6"],
["Quiet Orchard","movie",2018,12,15,30,88,"#6b8e23","#2f4f4f"],
["Glass House","series",2025,55,95,5,25,"#4b6cb7","#182848"],
["Rooftop Rhythm","movie",2023,85,10,55,65,"#ff6f61","#6a4bd8"],
["Old Friends","series",2017,25,5,75,95,"#b08968","#7f5539"],
["Signal Lost","series",2026,80,88,8,15,"#0f2027","#2c5364"],
["Pocket Heroes","movie",2022,75,15,80,70,"#f7971e","#ff5e62"]
];
var S=[["Energy",75,'<path d="M13 2L5 14h6l-1 8 8-12h-6z"/>'],["Suspense",30,'<path d="M2 12c3-6 5 6 8 0s5 6 8 0 3 3 4 0"/>'],["Humour",50,'<circle cx="12" cy="12" r="9"/><path d="M8 14c2 3 6 3 8 0M9 9h.01M15 9h.01"/>'],["Familiarity",80,'<path d="M12 21s-8-5-8-11a4.5 4.5 0 018-3 4.5 4.5 0 018 3c0 6-8 11-8 11z"/>']];
var $=function(s){return document.querySelector(s)};
var lab=function(v){return v<34?"Low":v<67?"Medium":"High"};
var view="home",q="",ranked=null,showAll=false,mine=[];
/* sliders */
$("#sl").innerHTML=S.map(function(s,i){return '<div class="row"><svg viewBox="0 0 24 24" aria-hidden="true">'+s[2]+'</svg><label for="s'+i+'">'+s[0]+'</label><input id="s'+i+'" type="range" min="0" max="100" value="'+s[1]+'" style="--v:'+s[1]+'%"><output id="o'+i+'" for="s'+i+'">'+lab(s[1])+'</output></div>'}).join("");
function vals(){return S.map(function(s,i){return +$("#s"+i).value})}
S.forEach(function(s,i){$("#s"+i).addEventListener("input",function(){this.style.setProperty("--v",this.value+"%");$("#o"+i).textContent=lab(+this.value)})});
/* generate */
function generate(){var v=vals();
 ranked=T.map(function(t,i){var d=0;for(var k=0;k<4;k++)d+=Math.abs(t[3+k]-v[k]);return {i:i,m:Math.round(100-d/4)}}).sort(function(a,b){return b.m-a.m});
 showAll=false;render();
 var top=ranked[0];$("#stat").textContent="Mix ready. Best match: "+T[top.i][0]+" ("+top.m+"%).";}
$("#gen").addEventListener("click",generate);
$("#surp").addEventListener("click",function(){S.forEach(function(s,i){var e=$("#s"+i),r=Math.round(Math.random()*100);e.value=r;e.style.setProperty("--v",r+"%");$("#o"+i).textContent=lab(r)});generate()});
/* nav */
$("#nav").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;view=b.dataset.v;showAll=false;
 [].forEach.call($("#nav").children,function(x){x.removeAttribute("aria-current")});b.setAttribute("aria-current","page");render()});
$("#sSearch").addEventListener("click",function(){$("#q").focus()});
$("#q").addEventListener("input",function(){q=this.value.trim().toLowerCase();render()});
$("#all").addEventListener("click",function(){showAll=!showAll;render()});
/* popovers */
var pop=$("#pop"),cur=null;
function openPop(id,btn,html){if(cur===id){closePop();return}cur=id;pop.innerHTML=html;pop.hidden=false;$("#bell").setAttribute("aria-expanded",id==="bell");$("#avt").setAttribute("aria-expanded",id==="prof");var f=pop.querySelector("button");if(f)f.focus()}
function closePop(){cur=null;pop.hidden=true;$("#bell").setAttribute("aria-expanded","false");$("#avt").setAttribute("aria-expanded","false")}
$("#bell").addEventListener("click",function(){openPop("bell",this,'<p><b>Notifications</b></p><button>New series added: Glass House</button><button>Your mood mix is ready</button><button>Weekend picks are in</button>')});
function prof(){openPop("prof",$("#avt"),'<p><b>Profile</b></p><button>Switch profile</button><button>Account</button><button>Sign out</button>')}
$("#avt").addEventListener("click",prof);$("#sProf").addEventListener("click",prof);
pop.addEventListener("click",function(e){var b=e.target.closest("button");if(b){$("#stat").textContent="“"+b.textContent+"” is a demo control.";closePop()}});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closePop()});
document.addEventListener("click",function(e){if(cur&&!e.target.closest(".pop,#bell,#avt,#sProf"))closePop()});
/* render cards */
function card(i,m){var t=T[i],on=mine.indexOf(i)>-1;
 return '<article class="t"><div class="th" style="background:linear-gradient(150deg,'+t[7]+','+t[8]+')" role="img" aria-label="Artwork for '+t[0]+'">'+t[0][0]+(m?'<b>'+m+'% match</b>':'')+'</div><strong>'+t[0]+'</strong><small>'+(t[1]==="movie"?"Movie":"Series")+' • '+t[2]+'</small><button data-i="'+i+'" aria-pressed="'+on+'">'+(on?"In My List ✓":"+ My List")+'</button></article>'}
function render(){
 var base=ranked?ranked:T.map(function(t,i){return {i:i,m:0}});
 var filtering=view!=="home"||q;
 var items=base.filter(function(x){var t=T[x.i];
  if(view==="movie"&&t[1]!=="movie")return false;
  if(view==="series"&&t[1]!=="series")return false;
  if(view==="list"&&mine.indexOf(x.i)<0)return false;
  if(q&&t[0].toLowerCase().indexOf(q)<0)return false;return true});
 $("#dj").hidden=view==="list";
 $("#ttl").textContent=view==="list"?"My List":q?"Search results":view==="movie"?"Movies":view==="series"?"Series":ranked?"Picked for your mood":"Popular Picks for You";
 var g=$("#grid");
 if(!filtering&&!ranked){g.innerHTML='<div class="ph"></div><div class="ph"></div><div class="ph"></div><div class="ph"></div><div class="ph"></div>';$("#all").hidden=false;$("#all").firstChild.nodeValue=showAll?"Show less ":"See all ";
  if(showAll){g.innerHTML=T.map(function(t,i){return card(i,0)}).join("")}return}
 var shown=(showAll||filtering)?items:items.slice(0,5);
 g.innerHTML=shown.length?shown.map(function(x){return card(x.i,ranked?x.m:0)}).join(""):'<div class="empty">'+(view==="list"?"Nothing in your list yet. Add titles with the + My List button.":"No titles match.")+'</div>';
 $("#all").hidden=filtering||items.length<=5;$("#all").firstChild.nodeValue=showAll?"Show less ":"See all ";
}
$("#grid").addEventListener("click",function(e){var b=e.target.closest("button[data-i]");if(!b)return;var i=+b.dataset.i,k=mine.indexOf(i);
 k>-1?mine.splice(k,1):mine.push(i);
 $("#stat").textContent=T[i][0]+(k>-1?" removed from":" added to")+" My List.";render();var n=document.querySelector('button[data-i="'+i+'"]');if(n)n.focus()});
render();
})();
</script>
</body>
</html
